<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PAGE_NAME}}: compare options | {{BRAND_NAME}}</title>
  <!--
    Dumdum Designer compare screen. Shows every option of one page in a single
    screen, with a switcher and phone, tablet and desktop sizes.
    The list of options is the OPTIONS list in the script at the bottom.
    To add or remove an option, change that list.
  -->
  <link rel="stylesheet" href="../../design/brand.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; background: var(--color-surface-muted); }
    .cmp-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
      padding: 12px 20px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }
    .cmp-title { margin: 0; font-size: var(--text-h4); }
    .cmp-title small { display: block; color: var(--color-text-muted); font-family: var(--font-body); font-weight: 400; font-size: var(--text-small); }
    .cmp-options { flex-wrap: wrap; }
    .cmp-spacer { flex: 1; }
    .cmp-note { padding: 8px 20px; background: var(--color-surface); border-bottom: 1px solid var(--color-border); color: var(--color-text-muted); font-size: var(--text-small); }
    .cmp-note strong { color: var(--color-text); }
    .cmp-stage { flex: 1; display: flex; justify-content: center; padding: 20px; overflow: auto; }
    .cmp-frame {
      width: 100%;
      max-width: 100%;
      height: 100%;
      min-height: 480px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-background);
      box-shadow: var(--shadow-large);
      transition: width 0.2s ease;
    }
    @media (max-width: 640px) {
      .cmp-bar { padding: 12px 16px; }
      .cmp-stage { padding: 12px; }
      .cmp-sizes { display: none; }
    }
  </style>
</head>
<body>
  <header class="cmp-bar">
    <h1 class="cmp-title">{{PAGE_NAME}}<small>Compare options. Use the arrow keys to switch.</small></h1>
    <div class="segmented cmp-options" role="group" aria-label="Options" id="options"></div>
    <div class="cmp-spacer"></div>
    <div class="segmented cmp-sizes" role="group" aria-label="Screen size" id="sizes">
      <button type="button" data-width="375" aria-pressed="false">Phone</button>
      <button type="button" data-width="768" aria-pressed="false">Tablet</button>
      <button type="button" data-width="" aria-pressed="true">Desktop</button>
    </div>
    <a class="button button-secondary button-small" id="open" href="#" target="_blank" rel="noopener">Open on its own</a>
  </header>
  <p class="cmp-note" id="note" aria-live="polite"></p>
  <main class="cmp-stage">
    <iframe class="cmp-frame" id="frame" title="Selected option"></iframe>
  </main>

  <script>
    // One entry per option: the file, a short label, and its direction in one line.
    const OPTIONS = [
      {{OPTIONS_LIST}}
    ];

    const frame = document.getElementById("frame");
    const optionsBox = document.getElementById("options");
    const note = document.getElementById("note");
    const openLink = document.getElementById("open");
    let current = 0;

    OPTIONS.forEach((option, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = option.label;
      button.addEventListener("click", () => show(index));
      optionsBox.appendChild(button);
    });

    function show(index) {
      current = (index + OPTIONS.length) % OPTIONS.length;
      const option = OPTIONS[current];
      frame.src = option.file;
      openLink.href = option.file;
      note.innerHTML = "";
      const label = document.createElement("strong");
      label.textContent = option.label + ": ";
      note.append(label, option.note);
      [...optionsBox.children].forEach((button, i) => button.setAttribute("aria-pressed", String(i === current)));
      history.replaceState(null, "", "#" + (current + 1));
    }

    document.querySelectorAll("#sizes button").forEach((button) => {
      button.addEventListener("click", () => {
        frame.style.width = button.dataset.width ? button.dataset.width + "px" : "100%";
        document.querySelectorAll("#sizes button").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
      });
    });

    document.addEventListener("keydown", (event) => {
      if (event.target.closest("input, textarea, select")) return;
      if (event.key === "ArrowRight") show(current + 1);
      if (event.key === "ArrowLeft") show(current - 1);
    });

    const start = parseInt(location.hash.slice(1), 10);
    show(Number.isInteger(start) ? start - 1 : 0);
  </script>
</body>
</html>
