<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PAGE_NAME}}: compare options | {{BRAND_NAME}}</title>
  <!--
    Dumdum Designer compare screen. Shows the options for each piece of a
    design in one screen, with a switcher, phone, tablet and desktop sizes,
    and a summary of the option currently chosen for each piece.
    The pieces and their options are the PIECES list in the script at the
    bottom. To add or remove an option or a piece, change that list.
  -->
  <link rel="stylesheet" href="../../design/brand.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; background: var(--color-surface-muted); }
    .cmp-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
      padding: 12px 20px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }
    .cmp-title { margin: 0; font-size: var(--text-h4); }
    .cmp-title small { display: block; color: var(--color-text-muted); font-family: var(--font-body); font-weight: 400; font-size: var(--text-small); }
    .cmp-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .cmp-group > span { color: var(--color-text-muted); font-size: var(--text-small); font-weight: 600; }
    .cmp-group .segmented { flex-wrap: wrap; }
    .cmp-spacer { flex: 1; }
    .cmp-info {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 24px;
      padding: 8px 20px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      color: var(--color-text-muted);
      font-size: var(--text-small);
    }
    .cmp-info strong { color: var(--color-text); }
    .cmp-picks:empty { display: none; }
    .cmp-stage { flex: 1; display: flex; justify-content: center; padding: 20px; overflow: auto; }
    .cmp-frame {
      width: 100%;
      max-width: 100%;
      height: 100%;
      min-height: 480px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-background);
      box-shadow: var(--shadow-large);
      transition: width 0.2s ease;
    }
    @media (max-width: 640px) {
      .cmp-bar { gap: 8px; padding: 8px 12px; }
      .cmp-title small, .cmp-group > span, .cmp-picks, #open, .cmp-sizes, .cmp-spacer { display: none; }
      .cmp-group .segmented button { min-height: 32px; padding: 4px 10px; font-size: var(--text-small); }
      .cmp-info { padding: 6px 12px; }
      .cmp-stage { padding: 8px; }
    }
  </style>
</head>
<body>
  <header class="cmp-bar">
    <h1 class="cmp-title">{{PAGE_NAME}}<small>Compare options. Use the arrow keys to switch.</small></h1>
    <div class="cmp-group" id="piece-group"><span>Piece</span><div class="segmented" role="group" aria-label="Piece" id="pieces"></div></div>
    <div class="cmp-group"><span>Option</span><div class="segmented" role="group" aria-label="Options" id="options"></div></div>
    <div class="cmp-spacer"></div>
    <div class="segmented cmp-sizes" role="group" aria-label="Screen size" id="sizes">
      <button type="button" data-width="375" aria-pressed="false">Phone</button>
      <button type="button" data-width="768" aria-pressed="false">Tablet</button>
      <button type="button" data-width="" aria-pressed="true">Desktop</button>
    </div>
    <a class="button button-secondary button-small" id="open" href="#" target="_blank" rel="noopener">Open on its own</a>
  </header>
  <div class="cmp-info">
    <p id="note" aria-live="polite" style="margin: 0"></p>
    <p class="cmp-picks" id="picks" style="margin: 0"></p>
  </div>
  <main class="cmp-stage">
    <iframe class="cmp-frame" id="frame" title="Selected option"></iframe>
  </main>

  <script>
    // One entry per piece of the design (the page itself, how Home leads into it,
    // an email...). Each piece has its options: the file or preview address,
    // a short label, and its direction in one line. A design with one piece has
    // one entry here, and the piece switcher hides itself.
    const PIECES = [
      {{PIECES_LIST}}
    ];

    const frame = document.getElementById("frame");
    const piecesBox = document.getElementById("pieces");
    const optionsBox = document.getElementById("options");
    const note = document.getElementById("note");
    const picks = document.getElementById("picks");
    const openLink = document.getElementById("open");
    const chosen = PIECES.map(() => 0);
    let piece = 0;

    if (PIECES.length < 2) document.getElementById("piece-group").hidden = true;

    PIECES.forEach((p, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = p.name;
      button.addEventListener("click", () => showPiece(index));
      piecesBox.appendChild(button);
    });

    function showPiece(index) {
      piece = index;
      [...piecesBox.children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === piece)));
      optionsBox.innerHTML = "";
      PIECES[piece].options.forEach((option, i) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = option.label;
        button.addEventListener("click", () => showOption(i));
        optionsBox.appendChild(button);
      });
      showOption(chosen[piece]);
    }

    function showOption(index) {
      const options = PIECES[piece].options;
      chosen[piece] = (index + options.length) % options.length;
      const option = options[chosen[piece]];
      frame.src = option.file;
      openLink.href = option.file;
      note.innerHTML = "";
      const label = document.createElement("strong");
      label.textContent = option.label + ": ";
      note.append(label, option.note);
      [...optionsBox.children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === chosen[piece])));
      if (PIECES.length > 1) {
        picks.textContent = "Showing: " + PIECES.map((p, i) => p.name + " " + p.options[chosen[i]].label).join(", ");
      }
      history.replaceState(null, "", "#" + (piece + 1) + "-" + (chosen[piece] + 1));
    }

    document.querySelectorAll("#sizes button").forEach((button) => {
      button.addEventListener("click", () => {
        frame.style.width = button.dataset.width ? button.dataset.width + "px" : "100%";
        document.querySelectorAll("#sizes button").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
      });
    });

    document.addEventListener("keydown", (event) => {
      if (event.target instanceof Element && event.target.closest("input, textarea, select")) return;
      if (event.key === "ArrowRight") showOption(chosen[piece] + 1);
      if (event.key === "ArrowLeft") showOption(chosen[piece] - 1);
      if (event.key === "ArrowDown" && PIECES.length > 1) showPiece((piece + 1) % PIECES.length);
      if (event.key === "ArrowUp" && PIECES.length > 1) showPiece((piece - 1 + PIECES.length) % PIECES.length);
    });

    // Open at #2-1 for the second piece's first option.
    const [startPiece, startOption] = location.hash.slice(1).split("-").map((n) => parseInt(n, 10) - 1);
    if (Number.isInteger(startPiece) && PIECES[startPiece]) {
      if (Number.isInteger(startOption) && PIECES[startPiece].options[startOption]) chosen[startPiece] = startOption;
      showPiece(startPiece);
    } else {
      showPiece(0);
    }
  </script>
</body>
</html>
