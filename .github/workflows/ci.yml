name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the marketplace and the plugin
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict ./dumdum-designer

      - name: Check every skill has a name and description
        run: |
          MISSING=0
          for SKILL in dumdum-designer/skills/*/SKILL.md; do
            FOLDER=$(basename "$(dirname "$SKILL")")
            if [ "$(head -n 1 "$SKILL")" != "---" ]; then
              echo "ERROR: $SKILL must start with a --- header block."
              MISSING=1
            fi
            if ! grep -q "^name: $FOLDER$" "$SKILL"; then
              echo "ERROR: $SKILL needs 'name: $FOLDER' in its header."
              MISSING=1
            fi
            if ! grep -q "^description: ." "$SKILL"; then
              echo "ERROR: $SKILL needs a description in its header."
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then exit 1; fi
          echo "All skills have a name and description."

      - name: Check shared references exist
        run: |
          MISSING=0
          for REF in $(grep -oh 'CLAUDE_PLUGIN_ROOT}/references/[A-Za-z0-9./_-]*' dumdum-designer/skills/*/SKILL.md dumdum-designer/references/*.md | sort -u); do
            FILE="dumdum-designer/${REF#CLAUDE_PLUGIN_ROOT\}/}"
            if [ ! -e "$FILE" ]; then
              echo "ERROR: $FILE is referenced but does not exist."
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then exit 1; fi
          echo "All referenced files exist."

      - name: Check for em-dashes
        run: |
          if grep -rn $'\xe2\x80\x94' --include='*.md' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.html' --include='*.css' .; then
            echo "ERROR: Em-dashes found in the files listed above. Use commas, periods, or rewrite the sentence."
            exit 1
          fi
          echo "No em-dashes found."
